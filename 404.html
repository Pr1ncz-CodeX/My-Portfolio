<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found - A. Prince Samuvel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 10px;
        }
        .error-card {
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="error-container">
        <div class="glass-card error-card card-3d">
            <h1 class="error-code gradient-text">404</h1>
            <h2>Page Not Found</h2>
            <p style="color: var(--text-secondary); margin: 15px 0 30px;">
                The page you are looking for doesn't exist or has been moved.
            </p>
            <a href="index.html" class="btn primary-btn">
                <i class="fa-solid fa-house"></i> Return to Portfolio
            </a>
        </div>
    </div>

</body>
</html>
